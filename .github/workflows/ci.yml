name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les runs précédents d'une même branche/PR pour économiser des minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # 1) LINT — pre-commit (ruff, black, mypy, bandit, gitleaks...)
  # -------------------------------------------------------------------------
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt
      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  # -------------------------------------------------------------------------
  # 2) TEST — pytest avec services Postgres + Redis
  # -------------------------------------------------------------------------
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agileiq
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: agileiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agileiq"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: testing
      SECRET_KEY: ci-secret-key-do-not-use
      JWT_SECRET_KEY: ci-jwt-secret-key-do-not-use
      DATABASE_URL: postgresql+psycopg://agileiq:ci-password@localhost:5432/agileiq_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      RATELIMIT_STORAGE_URI: redis://localhost:6379/3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt
      - name: Run pytest
        # --cov-fail-under=0 : on a peu de tests en Phase 0, on remontera
        # le seuil progressivement à mesure que les modules s'ajoutent.
        run: pytest --cov=app --cov-fail-under=0 --cov-report=term-missing

  # -------------------------------------------------------------------------
  # 3) BUILD — validation de l'image Docker
  # -------------------------------------------------------------------------
  build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: agileiq-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # 4) SECURITY-SCAN — Trivy sur l'image Docker
  # -------------------------------------------------------------------------
  security-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build local image for scan
        run: docker build -f docker/api.Dockerfile -t agileiq-api:scan .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agileiq-api:scan
          format: table
          severity: HIGH,CRITICAL
          # 0 = rapporte mais ne fait pas échouer la CI (à durcir plus tard)
          exit-code: 0
          ignore-unfixed: true
