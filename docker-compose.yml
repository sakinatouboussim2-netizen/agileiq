# ===========================================================================
# AgileIQ — docker-compose.yml  (environnement de DÉVELOPPEMENT)
#
# Stack minimale de la Phase 0 : api + postgres + redis.
# Les services ML, Celery, Prometheus, Grafana, Nginx seront ajoutés
# dans les phases suivantes.
#
# Démarrer :  docker compose up --build
# Arrêter  :  docker compose down
# ===========================================================================

services:
  # -------------------------------------------------------------------------
  # API Flask
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        ENV: development
    container_name: agileiq-api
    # Charge toutes les variables depuis .env (jamais committé)
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Montage du code en dev : modification locale = rechargement immédiat,
      # sans rebuild de l'image.
      - ./:/app
      # Volume anonyme pour NE PAS écraser le venv de l'image avec l'hôte
      - /app/.venv
    # En dev on remplace Gunicorn par le serveur Flask avec --reload
    command: >
      flask --app app.wsgi:app run
      --host 0.0.0.0 --port 8000 --reload --debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agileiq-net
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: agileiq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Exposé en local pour pouvoir s'y connecter avec un client SQL
      - "5432:5432"
    volumes:
      # Volume nommé : les données SURVIVENT à un `docker compose down`
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Le service api ne démarrera que quand ce test passe
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agileiq-net
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Redis (cache + broker Celery + rate limiting)
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: agileiq-redis
    # --appendonly yes : persistance des données Redis sur disque
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - agileiq-net
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Volumes nommés : persistent entre les redémarrages
# ---------------------------------------------------------------------------
volumes:
  pgdata:
    name: agileiq-pgdata
  redisdata:
    name: agileiq-redisdata

# ---------------------------------------------------------------------------
# Réseau dédié : isolation des services AgileIQ
# ---------------------------------------------------------------------------
networks:
  agileiq-net:
    name: agileiq-net
    driver: bridge
